name: ci

# lab-management-system-react (React 19 + Vite SPA)
# 推送链:
# - branch push(master/main)→ 只跑 test(对齐门禁 L1-L4)
# - tag push(v<X>.<Y>.<Z>-<YYYYMMDD> per tag.md §1)  → test + docker build & push + VPS 部署
# 镜像名/SSH 路径/部署脚本用 ${{ github.event.repository.name }} 避免跨仓劫持。
on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Phase 2 单测真化：jsdom dom 测试经 tests/global-setup.ts 起真 nextjs :5201，
    # 需要 ephemeral PG（服务容器，凭据随容器销毁，非真实 secret）。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lab_p2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 真化基座用 DB（migrate + seed + nextjs dev 同一连接串，job 级注入全局生效）
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lab_p2_test
      # JWT 铸造（tests/global-setup.ts）：CI 域自洽值（>=32 bytes），只在本 job 的
      # globalSetup 与 nextjs 进程间保持一致，非部署 secret；改走 GitHub secrets 时
      # 换 ${{ secrets.LAB_JWT_SECRET }} 即可（缺配置会 fail-fast 而非静默兜底）。
      LAB_JWT_SECRET: ci-lab-jwt-secret-phase2-0123456789abcdef
      LAB_JWT_ISSUER: lab-management-system
      # ADR-0019/CLAUDE.md §2：lab-nextjs src/lib/auth/factory.ts:48 readLabConfig
      # 走 requireKey 缺即 throw（commit 04228e1 2026-09-XX 加 LAB_AUTH_DEV_PASSWORD +
      # JWT_REFRESH_TTL_SECONDS 必填 key）。CI job env 缺这些 nextjs 进程收到的
      # env 与 .env.local 不全时,任何 lazy import 命中 requireKey 即崩。
      # 单后端独红 / 端口对照 saas-react 同步镜像:saas-reacct L4 test 9/10/11
      # 因 JWT_TTL_SECONDS 缺失假红,L4 test step exit 1 —— lab-react 同根因。
      # 镜像 saas-reacct 的根因 + 修复:
      # JWT_TTL_SECONDS / JWT_REFRESH_TTL_SECONDS / LAB_AUTH_DEV_PASSWORD
      # 三 key 本就是家族契约值(env.production / .env.test 都收齐),CI 同步即可。
      LAB_JWT_TTL_SECONDS: "3600"
      LAB_JWT_REFRESH_TTL_SECONDS: "604800"
      LAB_AUTH_DEV_PASSWORD: "dev123456"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmmirror.com/
      - name: Checkout shared sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/lab-management-system-shared.git ../lab-management-system-shared
      # msw sibling 仅为 nextjs sibling 的 file: 依赖 @lab/management-system-msw
      # 提供目录（部分路由仍吃 fixtures 形状层）；本仓测试已不再引 msw 源码
      # （Phase 2 拆除），故无需再给 sibling 装依赖。
      - name: Checkout msw sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/lab-management-system-msw.git ../lab-management-system-msw
      # nextjs sibling（真化基座起真服务）；其 file: 依赖 @lab/management-system-msw
      # 指向已 clone 的 msw sibling（部分路由仍吃 fixtures 形状层）
      - name: Checkout nextjs sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/lab-management-system-nextjs.git ../lab-management-system-nextjs
      - name: Install nextjs sibling dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ../lab-management-system-nextjs
      - name: gen:shared (nextjs sibling)
        run: npm run gen:shared
        working-directory: ../lab-management-system-nextjs
      - name: Install dependencies
        run: npm ci
      - name: gen:shared
        run: npm run gen:shared
      # 真化基座前置：schema 迁移 + 种子灌库（upsert 幂等，对 lab_p2_test）。
      # seed-db.mjs require pg（dependencies），migrate-db.mjs 走 drizzle-kit
      # （devDependencies）——不能 --omit=dev，这里必须全量装。
      - name: Install shared sibling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ../lab-management-system-shared
      - name: Migrate DB
        run: node scripts/migrate-db.mjs
        working-directory: ../lab-management-system-shared
        # drizzle.config.ts 强制读 PG_* 五件套(即便 DATABASE_URL 已设)—— 显式注入
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: lab_p2_test
      - name: Seed DB
        run: node scripts/seed-db.mjs
        working-directory: ../lab-management-system-shared
      # global-setup 会复用已健康服务：CI 里没有现成的，这里先拉起并探活，
      # 失败时倒日志便于排障
      - name: Start nextjs :5201
        working-directory: ../lab-management-system-nextjs
        run: |
          nohup npm run dev > /tmp/nextjs-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5201/api/health | grep -q '"ok":true'; then
              echo "nextjs :5201 healthy"; exit 0
            fi
            sleep 2
          done
          echo "nextjs :5201 探活超时"; tail -50 /tmp/nextjs-dev.log; exit 1
      - name: Build
        run: npm run build
      - name: L1 format
        run: npx --no prettier --check src tests
      - name: L2 lint
        run: npx --no eslint src tests
      - name: L3 typecheck
        run: npx --no tsc --noEmit
      - name: L4 test
        run: npx --no vitest run

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        # v0.2.12 起 deploy 脚本自举 nginx vhost，需要 NGINX_* vars 转发
        # （saas-react 同款；deploy 脚本有默认值，vars 未配也能跑）
        env:
          NGINX_DOMAIN: ${{ vars.NGINX_DOMAIN }}
          NGINX_CERT_BASENAME: ${{ vars.NGINX_CERT_BASENAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NGINX_DOMAIN,NGINX_CERT_BASENAME
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 拉 deploy 脚本
            # 总是重拉最新（脚本 bug fix 立即生效，与 saas 系同款）
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            # deploy 脚本自举 nginx vhost 时要拉模板（首次部署没有）
            if [ ! -f "nginx-vps.conf.example" ]; then
              curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/nginx-vps.conf.example" -o "nginx-vps.conf.example" || true
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"